name: Build Enemy Randomizer dlls (64-bit port fix)

on:
  workflow_dispatch:

jobs:
  build-er64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify source package exists
        run: |
          if [ ! -f "ER64-package.zip" ]; then
            echo "ERROR: ER64-package.zip not found in repository root!"
            echo "Please upload ER64-package.zip to the repo root."
            ls -la *.zip 2>/dev/null || echo "No ZIP files found."
            exit 1
          fi
          echo "OK: Found ER64-package.zip ($(stat -c%s ER64-package.zip) bytes)"
          echo "MD5: $(md5sum ER64-package.zip | cut -d' ' -f1)"

      - name: Unzip source package
        run: |
          rm -rf ER64-package
          unzip -q -o "ER64-package.zip" -d .
          echo "ZIP extracted. Contents:"
          ls -la ER64-package/
          echo "=== refs count ==="
          ls ER64-package/refs/ | wc -l
          echo "=== src cs count ==="
          find ER64-package/src -name '*.cs' | wc -l

      - name: Verify critical files
        run: |
          for f in build.sh src/EnemyRandomizer/Mod/EnemyRandomizer.cs src/EnemyRandomizerDB/Library/DatabaseAPI.cs src/CrashRecorder/CrashRecorder.cs src/RepackBridge/RepackBridge64.cs refs/Assembly-CSharp.dll refs/Satchel.dll; do
            if [ ! -f "ER64-package/$f" ]; then
              echo "FATAL: $f is MISSING from the ZIP!"
              exit 1
            fi
          done
          echo "OK: all critical files present"
          grep -n "persistentDataPath" ER64-package/src/EnemyRandomizer/Mod/EnemyRandomizer.cs | head -3 || { echo "FATAL: path fallback patch missing"; exit 1; }
          grep -n "Split(new char" ER64-package/src/CrashRecorder/CrashRecorder.cs || { echo "FATAL: 64-bit Split fix missing"; exit 1; }
          grep -n "bridge.cfg" ER64-package/src/RepackBridge/RepackBridge64.cs || { echo "FATAL: bridge mod missing config-handoff (gen-10+)"; exit 1; }
          grep -n "On.Modding.Preloader" ER64-package/src/RepackBridge/RepackBridge64.cs || { echo "FATAL: bridge mod missing preload loop-breaker (gen-12+)"; exit 1; }
          grep -n "loop-breaker armed" ER64-package/src/RepackBridge/RepackBridge64.cs || { echo "FATAL: bridge mod missing loop-breaker marker (gen-12+)"; exit 1; }

      - name: Compile with Roslyn (dotnet SDK csc)
        run: |
          cd ER64-package
          bash build.sh

      - name: Verify output markers
        run: |
          cd ER64-package
          for d in out/EnemyRandomizer.dll out/EnemyRandomizerDB.dll out/CrashRecorder.dll out/RepackBridge64.dll; do
            [ -f "$d" ] || { echo "FATAL: $d not produced"; exit 1; }
            echo "$d : $(stat -c%s $d) bytes"
          done
          strings -el out/EnemyRandomizer.dll | grep -c "64a" || { echo "FATAL: ER version marker missing"; exit 1; }
          strings -el out/CrashRecorder.dll | grep -c "v5-64" || { echo "FATAL: CR version marker missing"; exit 1; }
          strings -el out/RepackBridge64.dll | grep -c "RepackBridge64 v3" || { echo "FATAL: bridge marker missing"; exit 1; }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ER64-dlls
          path: |
            ER64-package/out/EnemyRandomizer.dll
            ER64-package/out/EnemyRandomizerDB.dll
            ER64-package/out/CrashRecorder.dll
            ER64-package/out/RepackBridge64.dll
