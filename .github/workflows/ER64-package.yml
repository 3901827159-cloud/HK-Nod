name: Build Enemy Randomizer dlls (64-bit port fix)

on:
  workflow_dispatch:

jobs:
  build-er64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify source package exists
        run: |
          if [ ! -f "ER64-package.zip" ]; then
            echo "ERROR: ER64-package.zip not found in repository root!"
            echo "Please upload ER64-package.zip to the repo root."
            ls -la *.zip 2>/dev/null || echo "No ZIP files found."
            exit 1
          fi
          echo "OK: Found ER64-package.zip ($(stat -c%s ER64-package.zip) bytes)"
          echo "MD5: $(md5sum ER64-package.zip | cut -d' ' -f1)"

      - name: Unzip source package
        run: |
          rm -rf ER64-package
          unzip -q -o "ER64-package.zip" -d .
          echo "ZIP extracted. Contents:"
          ls -la ER64-package/
          echo "=== refs count ==="
          ls ER64-package/refs/ | wc -l
          echo "=== src cs count ==="
          find ER64-package/src -name '*.cs' | wc -l

      - name: Verify critical files
        run: |
          for f in build.sh src/EnemyRandomizer/Mod/EnemyRandomizer.cs src/EnemyRandomizerDB/Library/DatabaseAPI.cs src/CrashRecorder/CrashRecorder.cs src/RepackBridge/RepackBridge64.cs refs/Assembly-CSharp.dll refs/Satchel.dll; do
            if [ ! -f "ER64-package/$f" ]; then
              echo "FATAL: $f is MISSING from the ZIP!"
              exit 1
            fi
          done
          echo "OK: all critical files present"
          grep -n "persistentDataPath" ER64-package/src/EnemyRandomizer/Mod/EnemyRandomizer.cs | head -3 || { echo "FATAL: path fallback patch missing"; exit 1; }
          grep -n "Split(new char" ER64-package/src/CrashRecorder/CrashRecorder.cs || { echo "FATAL: 64-bit Split fix missing"; exit 1; }
          grep -n "logMessageReceivedThreaded" ER64-package/src/CrashRecorder/CrashRecorder.cs || { echo "FATAL: CrashRecorder missing managed sink (v6-64+)"; exit 1; }
          if [ "$(grep -c 'java.lang.Runtime' ER64-package/src/CrashRecorder/CrashRecorder.cs)" -ge 2 ]; then
            echo "OK: CrashRecorder routes snapshot+stream through Runtime.exec (v7-64+)"
          else
            echo "FATAL: CrashRecorder missing Runtime.exec channel for logcat legs (v7-64+)!"; exit 1
          fi
          if grep -n "ProcessBuilder" ER64-package/src/CrashRecorder/CrashRecorder.cs | grep -v ':[[:space:]]*//'; then
            echo "FATAL: CrashRecorder still uses dead ProcessBuilder channel in code (v7-64 removed it)!"; exit 1
          fi
          if grep -n "On.ObjectPool.CreatePool +=" ER64-package/src/CrashRecorder/CrashRecorder.cs; then
            echo "FATAL: CrashRecorder re-armed the pool guard (v8-64 removed it: ref-args arrive null on 64-bit -> false blocks -> Spawn recursion SIGSEGV)!"; exit 1
          fi
          echo "OK: pool guard removed (v8-64)"
          if grep -n "On.AudioManager.ApplyMusicCue +=" ER64-package/src/RepackBridge/RepackBridge64.cs; then
            echo "FATAL: bridge re-armed music hooks (v3.8 removed them: MusicCue arrives null -> all music muted)!"; exit 1
          fi
          echo "OK: music hooks not installed (v3.8)"
          grep -n "logcat -d -v time >" ER64-package/src/CrashRecorder/CrashRecorder.cs || { echo "FATAL: snapshot leg command regression (v8-64 fixed form missing)"; exit 1; }
          if grep -n "pkill -x logcat" ER64-package/src/CrashRecorder/CrashRecorder.cs | grep -v ':[[:space:]]*//'; then
            echo "FATAL: CrashRecorder still uses broad pkill that killed the snapshot leg (v9-64 fixed it)!"; exit 1
          fi
          grep -n "pkill -f 'logcat -v tim\[e\]'" ER64-package/src/CrashRecorder/CrashRecorder.cs || { echo "FATAL: v9-64 targeted pkill form missing"; exit 1; }
          grep -n "work-\*" ER64-package/src/RepackBridge/RepackBridge64.cs || { echo "FATAL: bridge missing work-dir progress scan (v3.9)"; exit 1; }
          grep -n "phase2:" ER64-package/src/RepackBridge/RepackBridge64.cs || { echo "FATAL: bridge missing phase2 breadcrumb parsing (v3.9)"; exit 1; }
          grep -n "internal-copy" ER64-package/src/RepackBridge/RepackBridge64.cs || { echo "FATAL: bridge missing internal-dir load hop (v3.10, Android 10 namespace fix)"; exit 1; }
          grep -n "getCodeCacheDir" ER64-package/src/RepackBridge/RepackBridge64.cs || { echo "FATAL: bridge missing code-cache fallback dir (v3.10)"; exit 1; }
          grep -n "bridge.cfg" ER64-package/src/RepackBridge/RepackBridge64.cs || { echo "FATAL: bridge mod missing config-handoff (gen-10+)"; exit 1; }
          grep -n "embed-deps:" ER64-package/src/RepackBridge/RepackBridge64.cs || { echo "FATAL: bridge mod missing breadcrumb parser (gen-14+)"; exit 1; }
          grep -n "export_diag.txt" ER64-package/src/RepackBridge/RepackBridge64.cs || { echo "FATAL: bridge mod missing failure-state detection (gen-14+)"; exit 1; }
          grep -n "layout top:" ER64-package/src/RepackBridge/RepackBridge64.cs || { echo "FATAL: bridge mod missing layout stethoscope (gen-16+)"; exit 1; }
          grep -n "_cacheReadyAt" ER64-package/src/RepackBridge/RepackBridge64.cs || { echo "FATAL: bridge mod missing v3.11 fallback-close timer"; exit 1; }
          grep -n "fallback close" ER64-package/src/RepackBridge/RepackBridge64.cs || { echo "FATAL: bridge mod missing v3.11 fallback close"; exit 1; }
          grep -n "pour-fill" ER64-package/src/RepackBridge/RepackBridge64.cs || { echo "FATAL: bridge mod missing v3.11 pour-fill bar"; exit 1; }
          grep -n "KillPortBar" ER64-package/src/RepackBridge/RepackBridge64.cs || { echo "FATAL: bridge mod missing v3.12 port-bar killer"; exit 1; }
          grep -n "convfix" ER64-package/src/RepackBridge/RepackBridge64.cs || { echo "FATAL: bridge mod missing v3.15 convfix handoff"; exit 1; }
          if [ "$(grep -c 'LSCR-NULLGUARD-24' ER64-package/src/EnemyRandomizer/Mod/EnemyRandomizer.cs)" -ge 4 ]; then
            echo "OK: ER null-self guards present (24th gen)"
          else
            echo "FATAL: ER missing LSCR-NULLGUARD-24 guards (need >=4)!"; exit 1
          fi
          grep -n "EnsureGameData" ER64-package/src/RepackBridge/RepackBridge64.cs || { echo "FATAL: bridge mod missing v3.14 APK self-extraction"; exit 1; }
          grep -n "assets/bin/Data/" ER64-package/src/RepackBridge/RepackBridge64.cs || { echo "FATAL: bridge mod missing v3.14 apk data prefix"; exit 1; }
          if [ "$(grep -c 'LSCR-DIAG-26' ER64-package/src/EnemyRandomizer/Mod/EnemyRandomizer.cs)" -ge 3 ]; then
            echo "OK: ER preload/hook/pool diagnostics present (26th gen)"
          else
            echo "FATAL: ER missing LSCR-DIAG-26 diagnostics (need >=3)!"; exit 1
          fi
          grep -n "VERBOSE_LOGGING = true" ER64-package/src/EnemyRandomizer/Mod/EnemyRandomizer.cs || { echo "FATAL: ER missing forced replacement-pipeline logging (26th gen)"; exit 1; }
          grep -n "LSCR-FSMEVENT-26" ER64-package/src/EnemyRandomizer/Mod/BattleStateMachine.cs || { echo "FATAL: ER missing LSCR-FSMEVENT-26 Android hook skip"; exit 1; }
          grep -n "LSCR-FSMEVENT-37" ER64-package/src/EnemyRandomizerDB/Library/BattleStateMachine.cs || { echo "FATAL: DB BattleStateMachine (the copy that ACTUALLY COMPILES) missing LSCR-FSMEVENT-37 unconditional Event-hook skip - the 26-gen guard lived in the build.sh-EXCLUDED Mod copy and never shipped (2816 swallowed FSM events on device 2026-10-02)"; exit 1; }
          if grep -n "Event_FsmEvent +=\|Event_FsmEventTarget_string +=" ER64-package/src/EnemyRandomizerDB/Library/BattleStateMachine.cs; then
            echo "FATAL: DB BattleStateMachine re-armed the Fsm.Event hooks (port resolver lands the 1-arg detour on the 2-arg address -> marshalling flood + swallowed events)!"; exit 1
          fi
          grep -n "LSCR-DEADHOOK-37" ER64-package/src/EnemyRandomizerDB/Library/Spawners/SpawnedObjectControl.cs || { echo "FATAL: SpawnedObjectControl missing LSCR-DEADHOOK-37 dead-hook skip (EmitCorpse/SetConvoTitle/Language.Get have no AOT bridges on this port; 1353 failed per-spawn attempts + WARN flood)"; exit 1; }
          if grep -n "EmitCorpse +=\|Get_string_string +=\|SetConvoTitle +=" ER64-package/src/EnemyRandomizerDB/Library/Spawners/SpawnedObjectControl.cs; then
            echo "FATAL: SpawnedObjectControl re-armed dead hooks (no AOT bridge exists on this port -> per-spawn WARN flood)!"; exit 1
          fi
          grep -n "RuntimePlatform.Android" ER64-package/src/EnemyRandomizer/Mod/BattleStateMachine.cs || { echo "FATAL: BattleStateMachine missing Android platform guard"; exit 1; }
          grep -n "getAvailableBytes" ER64-package/src/RepackBridge/RepackBridge64.cs || { echo "FATAL: bridge missing v3.16 free-space gate (StatFs)"; exit 1; }
          grep -nE "v3\.(20|21): ctor" ER64-package/src/RepackBridge/RepackBridge64.cs || { echo "FATAL: bridge missing v3.20+ ctor marker"; exit 1; }
          grep -n "v3.21: ctor" ER64-package/src/RepackBridge/RepackBridge64.cs || { echo "FATAL: bridge missing v3.21 ctor marker"; exit 1; }
          grep -n "fuse fullscene engaged" ER64-package/src/RepackBridge/RepackBridge64.cs || { echo "FATAL: bridge missing v3.21 fuse switch"; exit 1; }
          grep -n "showmenu probe self=" ER64-package/src/RepackBridge/RepackBridge64.cs || { echo "FATAL: bridge missing v3.21 showmenu probe"; exit 1; }
          grep -n "TryFallbackCopy" ER64-package/src/RepackBridge/RepackBridge64.cs || { echo "FATAL: bridge missing v3.21 cracked-window fallback reader"; exit 1; }
          grep -n "quarantined" ER64-package/src/RepackBridge/RepackBridge64.cs || { echo "FATAL: bridge missing v3.20 shadow quarantine"; exit 1; }
          grep -n "FindGoodDataFile" ER64-package/src/RepackBridge/RepackBridge64.cs || { echo "FATAL: bridge missing v3.20 healthy-copy search"; exit 1; }
          grep -n "v3.19: extraction verified" ER64-package/src/RepackBridge/RepackBridge64.cs || { echo "FATAL: bridge missing v3.19 content verification"; exit 1; }
          grep -n "SIZE MISMATCH" ER64-package/src/RepackBridge/RepackBridge64.cs || { echo "FATAL: bridge missing v3.19 declared-vs-disk size reconciliation"; exit 1; }
          grep -n "TAIL MISMATCH" ER64-package/src/RepackBridge/RepackBridge64.cs || { echo "FATAL: bridge missing v3.19 tail digest reconciliation"; exit 1; }
          grep -n "FindDataFile" ER64-package/src/RepackBridge/RepackBridge64.cs || { echo "FATAL: bridge missing v3.19 nested data-file resolution"; exit 1; }
          grep -n "copy pass done" ER64-package/src/RepackBridge/RepackBridge64.cs || { echo "FATAL: bridge missing v3.19 pack-mode trimming report"; exit 1; }
          grep -n "corrupt cached bundle removed" ER64-package/src/RepackBridge/RepackBridge64.cs || { echo "FATAL: bridge missing v3.18 cached-bundle self-heal"; exit 1; }
          grep -n "HK_Data head BAD" ER64-package/src/RepackBridge/RepackBridge64.cs || { echo "FATAL: bridge missing v3.18 tree-head naming"; exit 1; }
          grep -n "ensuregamedata_diag" ER64-package/src/RepackBridge/RepackBridge64.cs || { echo "FATAL: bridge missing v3.17 on-disk diag trail"; exit 1; }
          grep -n "v3.17: diag free=" ER64-package/src/RepackBridge/RepackBridge64.cs || { echo "FATAL: bridge missing v3.17 free-space self-report"; exit 1; }
          if grep -n "java.nio.file.Files" ER64-package/src/RepackBridge/RepackBridge64.cs; then
            echo "FATAL: v3.14 reflection Files.copy is back (NoSuchMethodError on device 2026-10-01)!"; exit 1
          else
            echo "OK: stream-loop extraction (v3.17), reflection copy gone"
          fi
          grep -n "rolled back to previous HK_Data" ER64-package/src/RepackBridge/RepackBridge64.cs || { echo "FATAL: bridge missing v3.16 safe-swap rollback"; exit 1; }
          grep -n "extraction INVALID" ER64-package/src/RepackBridge/RepackBridge64.cs || { echo "FATAL: bridge missing v3.16 pre-swap verification"; exit 1; }
          # v3.16: LogTarget must be wired before AddComponent's Awake runs --
          # SetActive(false) has to appear BEFORE the AddComponent line in Boot.
          INACTIVE=$(grep -n "go.SetActive(false)" ER64-package/src/RepackBridge/RepackBridge64.cs | head -1 | cut -d: -f1)
          ADDCOMP=$(grep -n "AddComponent<PreloadUxBehaviour>" ER64-package/src/RepackBridge/RepackBridge64.cs | head -1 | cut -d: -f1)
          if [ -n "$INACTIVE" ] && [ -n "$ADDCOMP" ] && [ "$INACTIVE" -lt "$ADDCOMP" ]; then
            echo "OK: v3.16 log-before-Awake ordering (SetActive(false)@$INACTIVE < AddComponent@$ADDCOMP)"
          else
            echo "FATAL: bridge missing v3.16 SetActive-before-AddComponent ordering!"; exit 1
          fi
          # 28th gen: display-time Chinese localisation (keys must stay English)
          grep -n "LSCR-ZH-28" ER64-package/src/EnemyRandomizer/Mod/ZhMenuLocalizer.cs || { echo "FATAL: ER missing LSCR-ZH-28 localiser (28th gen)"; exit 1; }
          grep -n "NotoSerifCJKSCRegular" ER64-package/src/EnemyRandomizer/Mod/ZhMenuLocalizer.cs || { echo "FATAL: localiser missing CJK font acquisition"; exit 1; }
          grep -n "LateUpdate" ER64-package/src/EnemyRandomizer/Mod/ZhMenuLocalizer.cs || { echo "FATAL: localiser missing LateUpdate re-apply (Satchel resets labels in Update)"; exit 1; }
          if grep -nE "GetOption\(|loadedLogics|\.Name =" ER64-package/src/EnemyRandomizer/Mod/ZhMenuLocalizer.cs; then
            echo "FATAL: localiser must NEVER touch persisted keys (GetOption/loadedLogics/Name writes)!"; exit 1
          else
            echo "OK: localiser is display-only (no key writes)"
          fi

      - name: Compile with Roslyn (dotnet SDK csc)
        run: |
          cd ER64-package
          bash build.sh

      - name: Verify output markers
        run: |
          cd ER64-package
          for d in out/EnemyRandomizer.dll out/EnemyRandomizerDB.dll out/CrashRecorder.dll out/RepackBridge64.dll; do
            [ -f "$d" ] || { echo "FATAL: $d not produced"; exit 1; }
            echo "$d : $(stat -c%s $d) bytes"
          done
          strings -el out/EnemyRandomizer.dll | grep -c "64a" || { echo "FATAL: ER version marker missing"; exit 1; }
          strings -el out/CrashRecorder.dll | grep -c "v11-64" || { echo "FATAL: CR version marker missing"; exit 1; }
          strings -el out/RepackBridge64.dll | grep -c "RepackBridge64 v3" || { echo "FATAL: bridge marker missing"; exit 1; }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ER64-dlls
          path: |
            ER64-package/out/EnemyRandomizer.dll
            ER64-package/out/EnemyRandomizerDB.dll
            ER64-package/out/CrashRecorder.dll
            ER64-package/out/RepackBridge64.dll
